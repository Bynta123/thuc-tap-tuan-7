<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sản phẩm</title>
    <meta

      content="Ứng dụng quản lý sản phẩm: thêm, sửa, xóa, tìm kiếm, lọc và phân trang, xây dựng bằng React + TypeScript."
