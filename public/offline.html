<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không có kết nối mạng</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             background: #f4f7fb; color: #0f172a; }
      main { max-width: 380px; margin: 16px; padding: 28px; text-align: center; background: #fff;
             border: 1px solid #e2e8f0; border-radius: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 14px; color: #64748b; line-height: 1.5; }
      button { height: 38px; padding: 0 18px; border: 0; border-radius: 8px; background: #1d6ce0;
               color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang offline</h1>
      <p>Không thể tải trang này vì mất kết nối mạng và trang chưa được lưu trong bộ nhớ đệm.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
